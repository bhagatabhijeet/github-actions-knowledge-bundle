ecrets and variables  →  ③ Actions  →  ④ Secrets tab  →  ⑤ New repository secret</text><text x="320" y="714" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >You need admin access to the repository to see the Settings tab.</text></svg>