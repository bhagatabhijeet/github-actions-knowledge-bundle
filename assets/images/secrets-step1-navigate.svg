xt><text x="64" y="522" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >☁ Codespaces</text><text x="64" y="548" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >📄 Pages</text><text x="60" y="572" font-size="11" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Security</text><text x="64" y="596" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🛡 Code security and analysis</text><text x="64" y="622" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🔑 Deploy keys</text><text x="64" y="648" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >✳ Secrets and variables  ▾</text><rect x="70" y="658" width="190" height="24" rx="6" fill="#21262d" stroke="none" stroke-width="1" /><rect x="70" y="658" width="3" height="24" rx="1" fill="#2f81f7" stroke="none" stroke-width="1" /><text x="86" y="674" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Actions</text><text x="86" y="700" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Codespaces</text><text x="86" y="726" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Dependabot</text><text x="300" y="262" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Actions secrets and variables</text><text x="300" y="292" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Secrets and variables allow you to manage reusable configuration data. Secrets are encrypted and are used</text><text x="300" y="310" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >for sensitive data. Variables are shown as plain text and are used for non-sensitive data.</text><text x="300" y="338" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Anyone with collaborator access to this repository can use these secrets and variables for actions.</text><text x="300" y="356" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >They are not passed to workflows that are triggered by a pull request from a fork.</text><rect x="300" y="378" width="150" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect x="301" y="379" width="72" height="30" rx="5" fill="#21262d" stroke="none" stroke-width="1" /><text x="320" y="399" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Secrets</text><text x="386" y="399" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Variables</text><rect x="1000" y="378" width="150" height="32" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1" /><text x="1075" y="399" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >New repository secret</text><rect x="300" y="428" width="850" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" /><rect x="300" y="428" width="850" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="316" y="452" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Environment secrets</text><rect x="1018" y="436" width="120" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" /><text x="1078" y="452" font-size="11" fill="#c9d1d9" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Manage environments</text><text x="725" y="500" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >There are no secrets for this repository&#x27;s environments.</text><rect x="300" y="540" width="850" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" /><rect x="300" y="540" width="850" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="316" y="564" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Repository secrets</text><text x="725" y="612" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >There are no secrets for this repository.</text><rect x="773.2000000000002" y="180" width="97.2" height="40" rx="8" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="874.4000000000002" cy="182" r="17" fill="#e3b341" opacity="0.25"/><circle cx="874.4000000000002" cy="182" r="13" fill="#e3b341" stroke="#0d1117" stroke-width="2"/><text x="874.4000000000002" y="187" font-size="14" fill="#0d1117" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >1</text><rect x="56" y="628" width="208" height="32" rx="8" fill