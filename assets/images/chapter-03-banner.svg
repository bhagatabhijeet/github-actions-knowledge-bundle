<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Chapter 3: The Problem with Traditional CI/CD Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/>
      <stop offset="1" stop-color="#0a3f5c"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#56d4dd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <circle cx="1060" cy="40" r="150" fill="#3fb950" opacity="0.12"/>
  <circle cx="1130" cy="190" r="90" fill="#56d4dd" opacity="0.18"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="150" font-size="130" font-weight="800" fill="url(#num)">03</text>
    <text x="260" y="84" font-size="18" font-weight="700" letter-spacing="5" fill="#7ee787">CHAPTER THREE</text>
    <text x="260" y="132" font-size="36" font-weight="800" fill="#ffffff">The Problem with Traditional CI/CD Tools</text>
    <text x="260" y="172" font-size="22" font-weight="500" fill="#cfe9e2">When the build server becomes the project</text>
  </g>

  <!-- server rack glyph -->
  <g transform="translate(1090 110)" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.92">
    <rect x="-40" y="-46" width="80" height="26" rx="6"/>
    <rect x="-40" y="-13" width="80" height="26" rx="6"/>
    <rect x="-40" y="20" width="80" height="26" rx="6"/>
    <g fill="#ffffff" stroke="none">
      <circle cx="-24" cy="-33" r="4"/>
