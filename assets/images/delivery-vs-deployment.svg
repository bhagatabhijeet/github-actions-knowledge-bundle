<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Continuous delivery has a human approval before production; continuous deployment has none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#0d1117"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- lane 1 -->
    <text x="40" y="62" text-anchor="start" font-size="22" font-weight="800" fill="#ffa657">Continuous Delivery</text>
    <text x="270" y="62" text-anchor="start" font-size="17" fill="#c9d1d9">always ready to release; a person decides when</text>

    <g font-size="18" font-weight="700" fill="#ffffff">
      <rect x="40" y="90" width="200" height="84" rx="14" fill="#0c1d3a" stroke="#58a6ff" stroke-width="3"/>
      <text x="140" y="139">CI passes</text>
      <rect x="290" y="90" width="200" height="84" rx="14" fill="#3d1d00" stroke="#ffa657" stroke-width="3"/>
      <text x="390" y="139">Deploy to staging</text>
      <rect x="540" y="90" width="240" height="84" rx="14" fill="#3d2a00" stroke="#e3b341" stroke-width="3" stroke-dasharray="10 6"/>
      <text x="660" y="130">Human approval</text>
      <text x="660" y="156" font-size="14" font-weight="500" fill="#e3b341">the pipeline waits here</text>
      <rect x="830" y="90" width="330" height="84" rx="14" fill="#0f2d17" stroke="#3fb950" stroke-width="3"/>
      <text x="995" y="139">Deploy to production</text>
    </g>
    <g stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)">
      <line x1="244" y1="132" x2="286" y2="132"/>
      <line x1="494" y1="132" x2="536" y2="132"/>
      <line x1="784" y1="132" x2="826" y2="132"/>
    </g>

    <line x1="40" y1="216" x2="1160" y2="216" stroke="#30363d" stroke-width="2"/>

    <!-- lane 2 -->
    <text x="40" y="268" text-anchor="start" font-size="22" font-weight="800" fill="#3fb950">Continuous Deployment</text>
    <text x="304" y="268" text-anchor="start" font-size="17" fill="#c9d1d9">every green change goes live on its own</text>

    <g font-size="18" font-weight="700" fill="#ffffff">
      <rect x="40" y="296" width="200" height="84" rx="14" fill="#0c1d3a" stroke="#58a6ff" stroke-width="3"/>
      <text x="140" y="345">CI passes</text>
      <rect x="290" y="296" width="200" height="84" rx="14" fill="#3d1d00" stroke="#ffa657" stroke-width="3"/>
      <text x="390" y="345">Deploy to staging</text>
      <rect x="540" y="296" width="240" height="84" rx="14" fill="#22123f" stroke="#bc8cff" stroke-width="3"/>
      <text x="660" y="336">Automated checks</text>
      <text x="660" y="362" font-size="14" font-weight="500" fill="#d2a8ff">smoke tests, health probes</text>
      <rect x="830" y="296" width="330" height="84" rx="14" fill="#0f2d17" stroke="#3fb950" stroke-width="3"/>
      <text x="995" y="345">Deploy to production</text>
    </g>
    <g stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)">
      <line x1="244" y1="338" x2="286" y2="338"/>
      <line x1="494" y1="338" x2="536" y2="338"/>
      <line x1="784" y1="338" x2="826" y2="338"/>
    </g>
  </g>
</svg>
