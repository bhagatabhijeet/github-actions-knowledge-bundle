<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-label="GitHub Actions can automate repository activity, not just CI/CD. Pull request, issues, release, registry package and community events each have activity types such as opened, labeled, published or updated that can start a workflow">
<rect width="1400" height="720" rx="20" fill="#0d1117"/>
