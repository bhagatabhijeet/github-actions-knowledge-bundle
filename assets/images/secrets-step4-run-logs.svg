<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Two run logs of the Docker Login step. In run 2 the command shows username empty and password masked as three asterisks. In run 4, after changing dollar DOCKER_USERNAME to the vars context, the username is filled in and the password is still masked"><rect width="1200" height="720" rx="20" fill="#0d1117"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Step 4 · Run it and read the log</text><text x="600.0" y="76" font-size="15" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >The password is masked. The username was empty until we used vars.</text><rect x="30" y="100" width="555" height="400" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" /><text x="50" y="134" font-size="16" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan fill="#e6edf3" font-weight="700">✅ added repo level secrets</tspan><tspan fill="#8b949e" font-weight="400">  #2</tspan></text><rect x="50" y="152" width="515" height="330" rx="8" fill="#010409" stroke="#30363d" stroke-width="1" /><text x="66" y="180" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >docker</text><text x="66" y="198" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >succeeded</text><text x="66" y="226" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Set up job</text><text x="66" y="252" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Docker Build</text><text x="66" y="278" font-size="13" fill="#c9d1d9" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >⌄ ✅ Docker Login</text><text x="86" y="304" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#8b949e" font-weight="400">▶ Run echo docker login ...</tspan></text><rect x="74" y="311" width="480" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="86" y="328" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#e6edf3" font-weight="400">docker login --username=</tspan><tspan fill="#ff7b72" font-weight="800">␣</tspan><tspan fill="#e6edf3" font-weight="400"> --password=</tspan><tspan fill="#e3b341" font-weight="800">***</tspan></text><text x="86" y="362" font-size="13" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan fill="#ff7b72" font-weight="700">⚠️ username is EMPTY</tspan><tspan fill="#6e7681" font-weight="400">   ·   </tspan><tspan fill="#e3b341" font-weight="700">🔐 password masked</tspan></text><text x="66" y="396" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Docker Publish</text><text x="66" y="422" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Complete job</text><rect x="615" y="100" width="555" height="400" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" /><text x="635" y="134" font-size="16" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan fill="#e6edf3" font-weight="700">✅ modified variables</tspan><tspan fill="#8b949e" font-weight="400">  #4</tspan></text><rect x="635" y="152" width="515" height="330" rx="8" fill="#010409" stroke="#30363d" stroke-width="1" /><text x="651" y="180" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >docker</text><text x="651" y="198" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >succeeded</text><text x="651" y="226" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Set up job</text><text x="651" y="252" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Docker Build</text><text x="651" y="278" font-size="13" fill="#c9d1d9" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >⌄ ✅ Docker Login</text><text x="671" y="304" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#8b949e" font-weight="400">▶ Run echo docker login ...</tspan></text><rect x="659" y="311" width="480" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="671" y="328" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#e6edf3" font-weight="400">docker login --username=</tspan><tspan fill="#7ee787" font-weight="800">your-docker-id</tspan><tspan fill="#e6edf3" font-weight="400"> --password=</tspan><tspan fill="#e3b341" font-weight="800">***</tspan></text><text x="671" y="362" font-size="13" font-weight="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan fill="#7ee787" font-weight="700">✅ username filled in</tspan><tspan fill="#6e7681" font-weight="400">   ·   </tspan><tspan fill="#e3b341" font-weight="700">🔐 password masked</tspan></text><text x="651" y="396" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Docker Publish</text><text x="651" y="422" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >› ✅ Complete job</text><rect x="30" y="520" width="1140" height="170" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2" /><text x="50" y="552" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Why? A repository variable is not an environment variable.</text><text x="50" y="582" font-size="13" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Settings variables don&#x27;t appear as $DOCKER_USERNAME in the shell. They live in the vars context.</text><rect x="50" y="600" width="520" height="70" rx="8" fill="#3d0d0d" stroke="#f85149" stroke-width="1" /><text x="66" y="626" font-size="12" fill="#ff7b72" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >❌ run #2</text><text x="66" y="652" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >--username=$DOCKER_USERNAME</text><path d="M582 635 H612" stroke="#e3b341" stroke-width="4"/><path d="M612 623 L630 635 L612 647 Z" fill="#e3b341"/><rect x="640" y="600" width="510" height="70" rx="8" fill="#0f2d17" stroke="#3fb950" stroke-width="1" /><text x="656" y="626" font-size="12" fill="#7ee787" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >✅ run #4</text><text x="656" y="652" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >--username=${{ vars.DOCKER_USERNAME }}</text></svg>