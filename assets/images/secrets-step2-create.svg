<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The New secret form with the name DOCKER_PASSWORD, a hidden token value and the Add secret button. After saving, the Repository secrets list shows a lock icon, the name, Updated now, and edit and delete buttons. You can update, delete and use it as secrets.DOCKER_PASSWORD, but never see the value again"><rect width="1200" height="700" rx="20" fill="#0d1117"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Step 2 · Create the secret</text><text x="600.0" y="76" font-size="15" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Name it, paste the value, Add secret. Then it&#x27;s write-only.</text><rect x="30" y="100" width="620" height="570" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" /><text x="60" y="146" font-size="22" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan fill="#2f81f7">Actions secrets</tspan><tspan fill="#e6edf3"> / New secret</tspan></text><text x="60" y="192" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Name *</text><rect x="60" y="204" width="560" height="34" rx="6" fill="#0d1117" stroke="#2f81f7" stroke-width="2" /><text x="74" y="226" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >DOCKER_PASSWORD</text><text x="60" y="272" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Secret *</text><rect x="60" y="284" width="560" height="200" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" /><text x="74" y="312" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >dckr_pat_••••••••••••••••••••••</text><text x="74" y="470" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Paste the value. Whole files (keys, kubeconfigs) are fine, up to 48 KB.</text><rect x="60" y="506" width="110" height="34" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1" /><text x="115" y="528" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Add secret</text><rect x="60" y="566" width="560" height="82" rx="10" fill="#3d2a00" stroke="#e3b341" stroke-width="1" /><text x="76" y="592" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >💡 Store a Docker Hub access token, not your password.</text><text x="76" y="614" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >You can revoke a token on its own, and limit what it can do.</text><text x="76" y="634" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Names: letters, digits and _ · not starting with a digit or GITHUB_</text><rect x="56" y="200" width="568" height="42" rx="8" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="636" cy="200" r="17" fill="#e3b341" opacity="0.25"/><circle cx="636" cy="200" r="13" fill="#e3b341" stroke="#0d1117" stroke-width="2"/><text x="636" y="205" font-size="14" fill="#0d1117" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >6</text><rect x="56" y="280" width="568" height="208" rx="8" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="636" cy="280" r="17" fill="#e3b341" opacity="0.25"/><circle cx="636" cy="280" r="13" fill="#e3b341" stroke="#0d1117" stroke-width="2"/><text x="636" y="285" font-size="14" fill="#0d1117" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >7</text><rect x="56" y="502" width="118" height="42" rx="8" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="186" cy="500" r="17" fill="#e3b341" opacity="0.25"/><circle cx="186" cy="500" r="13" fill="#e3b341" stroke="#0d1117" stroke-width="2"/><text x="186" y="505" font-size="14" fill="#0d1117" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >8</text><path d="M660 380 H708" stroke="#e3b341" stroke-width="4"/><path d="M708 366 L730 380 L708 394 Z" fill="#e3b341"/><rect x="740" y="100" width="430" height="570" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" /><text x="760" y="146" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Repository secrets</text><rect x="760" y="166" width="390" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="778" y="200" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >🔒  DOCKER_PASSWORD</text><text x="1010" y="200" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Updated now</text><text x="1112" y="200" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >✏️</text><text x="1132" y="200" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🗑️</text><rect x="760" y="248" width="390" height="180" rx="10" fill="#0f2d17" stroke="#3fb950" stroke-width="1" /><text x="778" y="276" font-size="14" fill="#7ee787" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >What you can do now</text><text x="778" y="302" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >✏️  Update it with a new value</text><text x="778" y="326" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🗑️  Delete it</text><text x="778" y="350" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >📜  See when it was last updated</text><text x="778" y="374" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🔤  Read it in a workflow:</text><text x="798" y="400" font-size="13" fill="#7ee787" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >${{ secrets.DOCKER_PASSWORD }}</text><rect x="760" y="446" width="390" height="120" rx="10" fill="#3d0d0d" stroke="#f85149" stroke-width="1" /><text x="778" y="474" font-size="14" fill="#ff7b72" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >What you can never do</text><text x="778" y="500" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >👁️  See the value again, not even you</text><text x="778" y="524" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >📋  Copy it out of GitHub</text><text x="778" y="548" font-size="12" fill="#c9d1d9" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Lost it? Make a new token and update the secret.</text><text x="955" y="612" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Encrypted in your browser before it&#x27;s sent.</text><text x="955" y="634" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Write-only once saved.</text></svg>