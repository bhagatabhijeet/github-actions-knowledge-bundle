<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The New variable form, with a note that variable values are exposed as plain text, the naming rules, the name DOCKER_USERNAME and a value. Beside it, Settings lists the repository variable with its value visible and the repository secret with its value hidden, and a table compares vars and secrets"><rect width="1200" height="700" rx="20" fill="#0d1117"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Step 3 · Add a variable for the non-sensitive part</text><text x="600.0" y="76" font-size="15" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Same page, Variables tab. Everyone with access can read it.</text><rect x="30" y="100" width="620" height="570" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" /><text x="60" y="146" font-size="22" font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan fill="#2f81f7">Actions variables</tspan><tspan fill="#e6edf3"> / New variable</tspan></text><rect x="60" y="164" width="560" height="48" rx="8" fill="#3d2a00" stroke="#e3b341" stroke-width="1" /><text x="74" y="184" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Note: Variable values are exposed as plain text. If you need to</text><text x="74" y="202" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >encrypt and mask sensitive information, create a secret instead.</text><text x="60" y="242" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Name *</text><rect x="60" y="254" width="560" height="34" rx="6" fill="#0d1117" stroke="#2f81f7" stroke-width="2" /><text x="74" y="276" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >DOCKER_USERNAME</text><text x="74" y="312" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >• Alphanumeric characters ([a-z], [A-Z], [0-9]) or underscores (_) only.</text><text x="74" y="330" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >• Spaces are not allowed.</text><text x="74" y="348" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >• Cannot start with a number.</text><text x="74" y="366" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >• Cannot start with GITHUB_ prefix.</text><text x="60" y="400" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Value *</text><rect x="60" y="412" width="560" height="110" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" /><text x="74" y="440" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >your-docker-id</text><rect x="60" y="540" width="120" height="34" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1" /><text x="120" y="562" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Add variable</text><text x="60" y="612" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Variables tab → New repository variable</text><text x="60" y="636" font-size="13" fill="#ffa657" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Read it with  ${{ vars.DOCKER_USERNAME }}</text><rect x="56" y="160" width="568" height="56" rx="8" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="636" cy="160" r="17" fill="#e3b341" opacity="0.25"/><circle cx="636" cy="160" r="13" fill="#e3b341" stroke="#0d1117" stroke-width="2"/><text x="636" y="165" font-size="14" fill="#0d1117" font-weight="800" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >!</text><path d="M660 380 H708" stroke="#e3b341" stroke-width="4"/><path d="M708 366 L730 380 L708 394 Z" fill="#e3b341"/><rect x="740" y="100" width="430" height="570" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" /><text x="760" y="146" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Side by side in Settings</text><text x="760" y="184" font-size="13" fill="#c9d1d9" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Repository variables</text><rect x="760" y="196" width="390" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="776" y="227" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >DOCKER_USERNAME</text><text x="940" y="227" font-size="13" fill="#ffa657" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >your-docker-id</text><text x="1132" y="227" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >✏️</text><text x="776" y="268" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >👁️ the value is visible to collaborators</text><text x="760" y="312" font-size="13" fill="#c9d1d9" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Repository secrets</text><rect x="760" y="324" width="390" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="776" y="355" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >🔒 DOCKER_PASSWORD</text><text x="1010" y="355" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Updated now</text><text x="1132" y="355" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >✏️</text><text x="776" y="396" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🙈 the value is never shown</text><rect x="760" y="424" width="390" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" /><text x="778" y="452" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" ></text><text x="776" y="452" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" ></text><text x="880" y="452" font-size="12" fill="#ffa657" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >⚙️ Variable</text><text x="1020" y="452" font-size="12" fill="#7ee787" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >🔐 Secret</text><text x="776" y="484" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Context</text><text x="880" y="484" font-size="12" fill="#ffa657" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >vars.NAME</text><text x="1020" y="484" font-size="12" fill="#7ee787" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >secrets.NAME</text><text x="776" y="516" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Stored</text><text x="880" y="516" font-size="12" fill="#ffa657" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >plain text</text><text x="1020" y="516" font-size="12" fill="#7ee787" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >encrypted</text><text x="776" y="548" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >In Settings</text><text x="880" y="548" font-size="12" fill="#ffa657" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >value shown</text><text x="1020" y="548" font-size="12" fill="#7ee787" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >value hidden</text><text x="776" y="580" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >In logs</text><text x="880" y="580" font-size="12" fill="#ffa657" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >printed</text><text x="1020" y="580" font-size="12" fill="#7ee787" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >masked ***</text><text x="776" y="612" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Use for</text><text x="880" y="612" font-size="12" fill="#ffa657" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >usernames, URLs</text><text x="1020" y="612" font-size="12" fill="#7ee787" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >passwords, tokens</text></svg>