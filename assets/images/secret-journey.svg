<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="The journey of a repository secret. You type the value in Settings or with gh secret set. It is encrypted in your browser or CLI before it leaves your machine. GitHub stores only the encrypted value and nobody, including you, can read it back. When a job starts, the value is decrypted and handed to the runner. If it appears in the logs it is replaced with three asterisks. Below: what a secret is safe from and what it is not safe from">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bf8700"/><stop offset="1" stop-color="#e3b341"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="660" rx="20" fill="#0d1117"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="52" font-size="28" font-weight="800" fill="#e6edf3">A secret is locked before it leaves you, and unlocked only for the job</text>
    <text x="600" y="84" font-size="16" fill="#8b949e">Write-only in Settings · decrypted on the runner · masked in the logs</text>

    <!-- 4 stages -->
    <g stroke-width="2">
      <rect x="30"  y="116" width="260" height="250" rx="20" fill="#161b22" stroke="#58a6ff"/>
      <rect x="320" y="116" width="260" height="250" rx="20" fill="#161b22" stroke="#e3b341"/>
      <rect x="620" y="116" width="260" height="250" rx="20" fill="#161b22" stroke="#d2a8ff"/>
      <rect x="910" y="116" width="260" height="250" rx="20" fill="#161b22" stroke="#3fb950"/>
    </g>
    <g fill="none" stroke="#e3b341" stroke-width="3" marker-end="url(#a)">
      <path d="M292 240 H314"/><path d="M582 240 H614"/><path d="M882 240 H904"/>
    </g>

    <circle cx="450" cy="180" r="34" fill="#e3b341" opacity="0.35" filter="url(#glow)"/>
    <g font-size="36"><text x="160" y="186">⌨️</text><text x="450" y="192">🔒</text><text x="750" y="186">🗄️</text><text x="1040" y="186">🖥️</text></g>
    <g font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1"><text x="160" y="140">1 · YOU</text><text x="450" y="140">2 · YOUR MACHINE</text><text x="750" y="140">3 · GITHUB</text><text x="1040" y="140">4 · THE RUNNER</text></g>
    <g font-size="19" font-weight="800" fill="#e6edf3">
      <text x="160" y="226">Type the value</text><text x="450" y="226">Encrypted locally</text><text x="750" y="226">Stored encrypted</text><text x="1040" y="226">Decrypted for the job</text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="160" y="252">Settings → Secrets and</text><text x="160" y="270">variables → Actions</text>
      <text x="450" y="252">sealed with the repo's</text><text x="450" y="270">public key before upload</text>
      <text x="750" y="252">write-only: nobody can</text><text x="750" y="270">read it back, not even you</text>
      <text x="1040" y="252">only while the job runs,</text><text x="1040" y="270">only where you pass it</text>
    </g>
    <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="50" y="296" width="220" height="50" rx="10" fill="#010409"/>
      <text x="160" y="318" fill="#c9d1d9">DOCKER_PASSWORD</text><text x="160" y="336" fill="#58a6ff">s3cUrePaSsw0rd</text>
      <rect x="340" y="296" width="220" height="50" rx="10" fill="#010409"/>
      <text x="450" y="326" fill="#e3b341">kX9f…Qz2= (ciphertext)</text>
      <rect x="640" y="296" width="220" height="50" rx="10" fill="#010409"/>
      <text x="750" y="318" fill="#c9d1d9">DOCKER_PASSWORD</text><text x="750" y="336" fill="#8b949e">Updated 2 min ago · ✏️ 🗑️</text>
      <rect x="930" y="296" width="220" height="50" rx="10" fill="#010409"/>
      <text x="1040" y="318" fill="#c9d1d9">login succeeded</text><text x="1040" y="336" fill="#7ee787">password: ***</text>
    </g>

    <!-- safe from / not safe from -->
    <rect x="30" y="396" width="560" height="236" rx="20" fill="#0f2d17" stroke="#3fb950" stroke-width="2"/>
    <rect x="610" y="396" width="560" height="236" rx="20" fill="#3d0d0d" stroke="#f85149" stroke-width="2"/>
    <text x="310" y="432" font-size="19" font-weight="800" fill="#7ee787">🛡️ Protected from</text>
    <text x="890" y="432" font-size="19" font-weight="800" fill="#ff7b72">⚠️ Not protected from</text>
    <g font-size="15" fill="#e6edf3" text-anchor="start">
      <text x="56" y="472">✅ Anyone reading the code or Git history</text>
      <text x="56" y="504">✅ Collaborators browsing Settings</text>
      <text x="56" y="536">✅ The exact value printed in a log</text>
      <text x="56" y="568">✅ Pull requests from forks</text>
      <text x="56" y="600">✅ Being shown again after you save it</text>

      <text x="636" y="472">❌ A changed copy: base64, reversed, a substring</text>
      <text x="636" y="504">❌ A workflow file that sends it somewhere</text>
      <text x="636" y="536">❌ A third-party action you hand it to</text>
      <text x="636" y="568">❌ Being written into an artifact or file</text>
      <text x="636" y="600">❌ People with write access editing a workflow</text>
    </g>
  </g>
</svg>
