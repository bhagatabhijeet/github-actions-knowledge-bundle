# Chapter 2 companion workflow.
# Walkthrough: 02-basics-of-ci-cd/05-your-first-ci-pipeline.md

name: 02 - CI Basics

on:
  push:
    branches: [main]
    paths:
      - sample-app/**
      - .github/workflows/02-ci-basics.yml
  pull_request:
    paths:
      - sample-app/**
      - .github/workflows/02-ci-basics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sample-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sample-app/requirements-dev.txt

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the artifact
        run: |
          mkdir -p dist
          tar -czf "dist/greeter-${GITHUB_SHA::7}.tar.gz" greeter
          ls -lh dist

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: greeter
          path: sample-app/dist/
          retention-days: 7
