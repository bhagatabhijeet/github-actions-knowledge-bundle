# Chapter 4 companion workflow.
# Walkthrough: 04-github-actions-core-components/12-working-with-repository-secrets.md
#
# Safe to run with or without secrets set:
#   - DEMO_SECRET (optional): shows how log masking works
#   - DOCKER_USERNAME variable + DOCKER_PASSWORD secret (optional): logs in to Docker Hub
# Nothing is pushed anywhere.

name: 04 - Secrets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/04-secrets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  masking:
    runs-on: ubuntu-latest
    env:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}   # job-level env, so steps can test it in if:
    steps:
      - name: Is the secret set?
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "::notice::DEMO_SECRET is not set. Add it under Settings → Secrets and variables → Actions to see masking."
          else
            echo "DEMO_SECRET is set and has ${#DEMO_SECRET} characters"
          fi

      - name: Print it (GitHub masks it)
        if: ${{ env.DEMO_SECRET != '' }}
        run: echo "The secret is $DEMO_SECRET"          # appears as ***

      - name: A changed copy is NOT masked automatically
        if: ${{ env.DEMO_SECRET != '' }}
        run: |
          ENCODED=$(printf '%s' "$DEMO_SECRET" | base64)
          echo "::add-mask::$ENCODED"                     # so we mask it ourselves
          echo "Base64 copy: $ENCODED"                    # now also ***

  docker-login:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      HAS_PASSWORD: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - name: Skip politely if not configured
        if: ${{ env.DOCKER_USERNAME == '' || env.HAS_PASSWORD != 'true' }}
        run: echo "::notice::Set the DOCKER_USERNAME variable and DOCKER_PASSWORD secret to try a real login."

      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.HAS_PASSWORD == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prove it worked
        if: ${{ env.DOCKER_USERNAME != '' && env.HAS_PASSWORD == 'true' }}
        run: docker info --format 'Logged in to {{.IndexServerAddress}}'
